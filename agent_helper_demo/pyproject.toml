[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-helper-demo"
version = "0.1.0"
description = "Example agent_helper plugin (notes and leave balance) on its own"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
dependencies = [
    "agent-helper==0.1.0",
]

[tool.setuptools.packages.find]
include = ["agent_helper_demo*"]
